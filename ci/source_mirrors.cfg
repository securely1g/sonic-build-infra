# Prefer the SONiC mirror for the reviewed Debian and security snapshots.
# Keep canonical URLs in the APT lock; Bazel verifies the locked SHA256.
rewrite snapshot\.debian\.org/archive/debian/20260727T143429Z/(.*) https://packages.trafficmanager.net/snapshot/debian/20260727T000818Z/$1
rewrite snapshot\.debian\.org/archive/debian-security/20260726T121236Z/(.*) https://packages.trafficmanager.net/snapshot/debian-security/20260727T000824Z/$1
# Retain Cloudflare and the original snapshot for all snapshot timestamps.
rewrite snapshot\.debian\.org/(.*) https://snapshot-cloudflare.debian.org/$1
rewrite snapshot\.debian\.org/(.*) https://snapshot.debian.org/$1
