name: Declared build tools

on:
  pull_request:
    paths: ['apt/**', 'toolchains/bookworm/**', 'toolchains/gcc/**', 'tools/build_tools/**', 'MODULE.bazel', '.github/workflows/declared-build-tools.yml']
  push:
    branches: [master]
    paths: ['apt/**', 'toolchains/bookworm/**', 'toolchains/gcc/**', 'tools/build_tools/**', 'MODULE.bazel', '.github/workflows/declared-build-tools.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Validate tools, or resolve reviewed APT lock metadata only
        type: choice
        options: [validate, update-lock]
        default: validate
      expected_source_sha:
        description: Exact reviewed source commit required for update-lock
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: declared-build-tools-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'update-lock' && '-update-lock' || '' }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'validate'
    name: Build tools (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: x86_64_trixie
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: aarch64_trixie
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      PLATFORM: ${{ matrix.platform }}
      BAZEL_ARCH: ${{ matrix.bazel_arch }}
      BAZEL_SHA: ${{ matrix.bazel_sha }}
      SONIC_BAZEL_REGISTRY: https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main
    steps:
      - name: Prepare Bazel bootstrap dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git python3 tar xz-utils
          [[ "$(dpkg --print-architecture)" == "$ARCHITECTURE" ]]
          test ! -e /usr/bin/aspell
          test ! -e /usr/bin/doxygen
          curl --fail --location --retry 3 --output /usr/local/bin/bazel \
            "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-$BAZEL_ARCH"
          printf '%s  %s\n' "$BAZEL_SHA" /usr/local/bin/bazel | sha256sum --check --strict
          chmod +x /usr/local/bin/bazel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build executable tools and exercise sandboxed invocation
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          printf '%s\n' "$SONIC_BAZEL_REGISTRY" > ci-artifacts/registry.txt
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD HEAD^{tree} > ci-artifacts/revisions.txt
          printf '%s\n' "$GITHUB_RUN_ID" > ci-artifacts/github-run-id.txt
          uname -a > ci-artifacts/uname.txt
          dpkg --print-architecture > ci-artifacts/architecture.txt
          cp /etc/os-release ci-artifacts/os-release
          python3 apt/lock.py check | tee ci-artifacts/apt-lock-check.log
          mkdir -p ci-artifacts/apt ci-artifacts/ci
          cp apt/apt.lock.json apt/sources.json apt/requests.json ci-artifacts/apt/
          cp ci/source_mirrors.cfg ci-artifacts/ci/
          sha256sum MODULE.bazel apt/apt.lock.json apt/sources.json apt/requests.json ci/source_mirrors.cfg > ci-artifacts/inputs.sha256
          flags=(--registry="$SONIC_BAZEL_REGISTRY" \
                 --registry=https://bcr.bazel.build/ --platforms="//platforms:$PLATFORM" \
                 --host_platform="//platforms:$PLATFORM" \
                 --downloader_config="$PWD/ci/source_mirrors.cfg" \
                 '--remote_download_regex=(^|.*/)tools/build_tools/kernel_runtime_(amd64|arm64)(/.*)?$' \
                 --repository_cache="$RUNNER_TEMP/configure-tools-repository-cache" \
                 --disk_cache="$RUNNER_TEMP/configure-tools-cache" --lockfile_mode=update)
          bazel --ignore_all_rc_files build "${flags[@]}" \
            --build_event_json_file="$PWD/ci-artifacts/build-events.jsonl" \
            //tools/build_tools:aspell //tools/build_tools:doxygen \
            //tools/build_tools:make //tools/build_tools:m4 \
            //tools/build_tools:pkgconf //tools/build_tools:perl \
            //tools/build_tools:bison //tools/build_tools:flex \
            //tools/build_tools:autoconf //tools/build_tools:autoheader //tools/build_tools:autom4te \
            //tools/build_tools:patchelf //tools/build_tools:gawk //tools/build_tools:swig \
            //tools/build_tools:patch //tools/build_tools:xmllint //tools/build_tools:xsltproc \
            //tools/build_tools:launcher_action_check 2>&1 | tee ci-artifacts/build.log
          cp bazel-bin/tools/build_tools/launcher_action_check.json ci-artifacts/
          worker_tests=()
          if [[ "$ARCHITECTURE" == amd64 ]]; then
            worker_tests+=(//tools/build_tools:installer_worker_debs_test)
          fi
          bazel --ignore_all_rc_files test "${flags[@]}" --nocache_test_results \
            --test_output=errors --build_event_json_file="$PWD/ci-artifacts/test-events.jsonl" \
            //tests:host_patchelf_test //tests:source_host_tools_test \
            //tools/build_tools:runtime_test \
            //tools/build_tools:runtime_launcher_test \
            //tools/autoconf:launcher_test \
            //tools/autoconf:argv_paths_test \
            //tools/autoconf/tests:declared_tools_test //tools/autoconf/tests:relocatable_pkgconfig_test \
            //tools/build_tools:gdb_runtime_test \
            //cc/tests/toolchain_variant:library_provider_test \
            //cc/tests/toolchain_variant:shared_provider_test \
            //cc/tests/toolchain_variant:symbols_provider_test \
            //cc/tests/toolchain_variant:binary_runfiles_test \
            //cc/tests/toolchain_variant:imported_shared_consumer_test \
            //tools/build_tools:configure_runtime_test \
            //tools/build_tools:foreign_runtime_test //tools/build_tools:libtool_test \
            //tools/build_tools:kerberos_runtime_test \
            //tools/build_tools:test_runtime_test \
            //tools/build_tools:perl_bookworm_test \
            //tools/build_tools:bookworm_test_runtime_test \
            //tools/build_tools:configure_make_test \
            //tools/build_tools:prepare_rootfs_test //tools/build_tools:kernel_runtime_test \
            "${worker_tests[@]}" \
            2>&1 | tee ci-artifacts/test.log
          mkdir -p ci-artifacts/libtool
          bazel --ignore_all_rc_files cquery "${flags[@]}" --output=files \
            'set(//tools/build_tools:libtool_program //tools/build_tools:libtool_library //tools/build_tools:libtool_c_library //tools/build_tools:libtool_config //tools/build_tools:libtool_argv_validation)' \
            > ci-artifacts/libtool/outputs.txt
          while IFS= read -r file; do cp -L "$file" ci-artifacts/libtool/; done < ci-artifacts/libtool/outputs.txt
          (cd ci-artifacts/libtool && sha256sum probe libprobe.so.0 libcprobe.so.0 config.log compiler-argv-validation.json > SHA256SUMS)
          bazel --ignore_all_rc_files aquery "${flags[@]}" --output=jsonproto \
            'deps(//tools/build_tools:configure_make_test)' > ci-artifacts/configure-actions.json
          test -s MODULE.bazel.lock
          cp -aL bazel-testlogs ci-artifacts/initial-testlogs
          bazel --ignore_all_rc_files --output_user_root="$RUNNER_TEMP/configure-tools-fresh" \
            test "${flags[@]}" --nocache_test_results --test_output=errors \
            --build_event_json_file="$PWD/ci-artifacts/cache-test-events.jsonl" \
            --execution_log_json_file="$PWD/ci-artifacts/cache-spawns.json" \
            --execution_log_sort=false \
            //tools/build_tools:configure_runtime_test //tools/build_tools:foreign_runtime_test \
            //tools/build_tools:kernel_runtime_test \
            2>&1 | tee ci-artifacts/cache-test.log
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          data = Path("ci-artifacts/cache-spawns.json").read_text()
          decoder = json.JSONDecoder()
          offset, runtimes = 0, []
          while offset < len(data):
              record, offset = decoder.raw_decode(data, offset)
              if record.get("mnemonic") in ("PrepareBuildTools", "PrepareBuildToolsRootfs"):
                  runtimes.append({key: record.get(key) for key in ("mnemonic", "targetLabel", "listedOutputs", "runner", "cacheHit")})
              while offset < len(data) and data[offset].isspace():
                  offset += 1
          # Compiled tools may need multiple target/exec runtime configurations.
          # Both runtime kinds must be restored for every required config.
          assert {row["mnemonic"] for row in runtimes} == {"PrepareBuildTools", "PrepareBuildToolsRootfs"}, runtimes
          kernel_label = "//tools/build_tools:kernel_runtime_" + os.environ["ARCHITECTURE"]
          assert any(row["mnemonic"] == "PrepareBuildToolsRootfs"
                     and str(row["targetLabel"]).endswith(kernel_label) for row in runtimes), runtimes
          assert all(item["cacheHit"] and item["runner"] == "disk cache hit"
                     for item in runtimes), runtimes
          Path("ci-artifacts/cache-reuse.json").write_text(json.dumps(runtimes, indent=2) + "\n")
          PYTHON
      - name: Collect resolution and test evidence
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp MODULE.bazel ci-artifacts/
          if [[ -f MODULE.bazel.lock ]]; then cp MODULE.bazel.lock ci-artifacts/; fi
          if [[ -d bazel-testlogs ]]; then cp -aL bazel-testlogs ci-artifacts/testlogs; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: declared-build-tools-${{ matrix.architecture }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30

  update-lock:
    name: Resolve reviewed APT lock metadata (amd64)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    env:
      ARCHITECTURE: amd64
      BAZEL_ARCH: x86_64
      BAZEL_SHA: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
      BAZEL: /usr/local/bin/bazel
      SONIC_BAZEL_REGISTRY: https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/618c7279e814b858f803fd6b4891e99eedcb2400
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Prepare Bazel bootstrap dependencies
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git python3 tar xz-utils
          [[ "$(dpkg --print-architecture)" == "$ARCHITECTURE" ]]
          test ! -e /usr/bin/aspell
          test ! -e /usr/bin/doxygen
          curl --fail --location --retry 3 --output /usr/local/bin/bazel \
            "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-$BAZEL_ARCH"
          printf '%s  %s\n' "$BAZEL_SHA" /usr/local/bin/bazel | sha256sum --check --strict
          chmod +x /usr/local/bin/bazel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact inputs and preserve the previous lock
        id: inputs
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' \
            '4b704b2660cb7e873085e478ba1c8c213161fb0742da93b1d92cbd695df19531  apt/apt.lock.json' \
            '2fa280945c553a7183fbb57460280cfb6f2fb5c9acdc95fe51f01e7c14e1c227  apt/sources.json' \
            '3a8f03392f0b44a9081e76314784b2cc3c1c4393b9593bc489f8de3bcbe463dc  apt/requests.json' \
            '232d4b3fed61b3001106c9c18c04f15be08d1a65e83b520faee318043ae47059  apt/lock.py' \
            '47b88e49e5348e3e05bbfcb44278ab61f2fdd5fb38357923c6b5bbe8fcc3bce6  ci/source_mirrors.cfg' | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/apt-lock-update"
          mkdir "$RUNNER_TEMP/apt-lock-update/inputs"
          cp apt/apt.lock.json "$RUNNER_TEMP/apt-lock-update/apt.lock.json"
          cp apt/apt.lock.json "$RUNNER_TEMP/apt-lock-update/inputs/seed.lock.json"
          cp apt/sources.json apt/requests.json apt/lock.py ci/source_mirrors.cfg MODULE.bazel "$RUNNER_TEMP/apt-lock-update/inputs/"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/apt-lock-update/inputs/revisions.txt"
      - name: Update and check scratch lock through the maintained resolver
        id: update
        run: |
          set -euo pipefail
          python3 apt/lock.py update \
            --sources apt/sources.json --requests apt/requests.json \
            --lock "$RUNNER_TEMP/apt-lock-update/apt.lock.json" \
            --work-dir "$RUNNER_TEMP/apt-lock-update/resolver" \
            --bazel "$BAZEL" --resolver-version 0.9.4.sonic.17 \
            --registry "$SONIC_BAZEL_REGISTRY" --registry https://bcr.bazel.build/ \
            --bazel-startup-option=--ignore_all_rc_files \
            --bazel-option="--downloader_config=$GITHUB_WORKSPACE/ci/source_mirrors.cfg" \
            2>&1 | tee "$RUNNER_TEMP/apt-lock-update/update.log"
          python3 apt/lock.py check \
            --sources apt/sources.json --requests apt/requests.json \
            --lock "$RUNNER_TEMP/apt-lock-update/apt.lock.json" \
            --resolver-version 0.9.4.sonic.17 \
            2>&1 | tee "$RUNNER_TEMP/apt-lock-update/check.log"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "apt-lock-update"
          previous = json.loads((root / "inputs/seed.lock.json").read_text())
          result = json.loads((root / "apt.lock.json").read_text())
          assert len(previous["dependency_sets"]) == 45 and len(previous["packages"]) == 2210
          assert len(result["dependency_sets"]) == 53
          for name, group in previous["dependency_sets"].items():
              assert set(result["dependency_sets"][name]["sets"]) == set(group["sets"]), name
          for key, old in previous["packages"].items():
              current = result["packages"][key]
              for field in ("name", "version", "architecture", "suite", "filename", "sha256"):
                  assert current[field] == old[field], (key, field)
              for field in old:
                  if field.endswith("_sha256"):
                      assert current[field] == old[field], (key, field)
          summary = {"schema": 1, "preserved_group_architecture_sets": 45,
                     "preserved_package_identities": 2210,
                     "new_group_architectures": {name: sorted(group["sets"])
                         for name, group in result["dependency_sets"].items()
                         if name not in previous["dependency_sets"]},
                     "consumer_request_and_native_validation": "pending review"}
          (root / "preservation.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          PYTHON
      - name: Collect bounded metadata evidence
        id: evidence
        if: always() && steps.inputs.outcome == 'success'
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          set -euo pipefail
          cmp apt/apt.lock.json "$RUNNER_TEMP/apt-lock-update/inputs/seed.lock.json"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PYTHON'
          import gzip
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat

          FILE_LIMIT = 16 * 1024 * 1024
          STORED_TOTAL_LIMIT = 64 * 1024 * 1024
          RAW_LIMIT = 128 * 1024 * 1024
          PROVENANCE_LIMIT = 64 * 1024
          CHUNK = 1024 * 1024

          def require(condition, reason, name, info=None, **details):
              if not condition:
                  raise ValueError(json.dumps({
                      "reason": reason, "path": name,
                      "observed_type": stat.S_IFMT(info.st_mode) if info else "generated",
                      "observed_size": info.st_size if info else details.get("size"),
                      **details,
                  }, sort_keys=True))

          def identity(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_size,
                      info.st_mtime_ns, info.st_ctime_ns)

          def read_source(path, info, consume):
              digest, size = hashlib.sha256(), 0
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), "rb") as stream:
                  opened = os.fstat(stream.fileno())
                  require(stat.S_ISREG(opened.st_mode) and identity(opened) == identity(info),
                          "source_identity_before_read", str(path), opened, expected_size=info.st_size)
                  while True:
                      data = stream.read(min(CHUNK, info.st_size - size + 1))
                      if not data:
                          break
                      size += len(data)
                      require(size <= info.st_size, "source_grew_during_read", str(path), info,
                              bytes_read=size)
                      digest.update(data)
                      consume(data)
                  require(size == info.st_size and identity(os.fstat(stream.fileno())) == identity(info)
                          and identity(path.lstat()) == identity(info),
                          "source_identity_after_read", str(path), info, bytes_read=size)
              return {"size": size, "sha256": digest.hexdigest()}

          class BoundedBuffer(io.BytesIO):
              def __init__(self, limit, name, info):
                  super().__init__()
                  self.limit, self.name, self.info = limit, name, info
                  self.digest = hashlib.sha256()

              def write(self, data):
                  require(self.tell() + len(data) <= self.limit,
                          "compressed_stored_size_limit", self.name, self.info,
                          stored_bytes=self.tell(), next_write_bytes=len(data), limit=self.limit)
                  count = super().write(data)
                  self.digest.update(data)
                  return count

          source = Path(os.environ["RUNNER_TEMP"]) / "apt-lock-update"
          output = Path(os.environ["RUNNER_TEMP"]) / "apt-lock-update-evidence"
          assert not output.exists()
          assert source.is_dir() and not source.is_symlink()
          files = [("inputs/" + name, True) for name in (
              "seed.lock.json", "sources.json", "requests.json", "lock.py",
              "source_mirrors.cfg", "MODULE.bazel", "revisions.txt")]
          files += [("update.log", False), ("check.log", False)]
          if os.environ["UPDATE_OUTCOME"] == "success":
              files += [("apt.lock.json", True), ("preservation.json", True)]
          resolver = source / "resolver"
          if resolver.exists():
              assert resolver.is_dir() and not resolver.is_symlink()
              partitions = [p for p in resolver.iterdir() if re.fullmatch(r"partition-[0-9]+", p.name)]
              require(len(partitions) <= 8, "partition_count_limit", str(resolver),
                      resolver.lstat(), count=len(partitions), limit=8)
              for partition in sorted(partitions):
                  assert partition.is_dir() and not partition.is_symlink()
                  for name in ("MODULE.bazel", "MODULE.bazel.lock", "BUILD.bazel", "sources.json",
                               "requests.json", "previous.lock.json", "resolve.log"):
                      files.append(("resolver/" + partition.name + "/" + name, False))
          records, compression, compressed_data, plain_info = {}, {}, {}, {}
          total, raw_total = 0, 0
          for name, required in files:
              path = source / name
              if not path.exists() and not path.is_symlink():
                  require(not required, "required_file_missing", name)
                  continue
              for parent in path.relative_to(source).parents:
                  require(not (source / parent).is_symlink(), "symlink_parent", name,
                          (source / parent).lstat())
              info = path.lstat()
              require(stat.S_ISREG(info.st_mode), "nonregular_file", name, info)
              compress = re.fullmatch(r"resolver/partition-[0-9]+/MODULE\.bazel\.lock", name) and info.st_size > FILE_LIMIT
              require(info.st_size <= (RAW_LIMIT if compress else FILE_LIMIT),
                      "raw_file_size_limit", name, info, limit=RAW_LIMIT if compress else FILE_LIMIT)
              raw_total += info.st_size
              require(raw_total <= RAW_LIMIT, "raw_payload_total_limit", name, info,
                      raw_payload_bytes=raw_total, limit=RAW_LIMIT)
              if compress:
                  stored_name = name + ".gz"
                  with BoundedBuffer(min(FILE_LIMIT, STORED_TOTAL_LIMIT - total), name, info) as buffer:
                      with gzip.GzipFile(filename="", mode="wb", fileobj=buffer,
                                         compresslevel=6, mtime=0) as zipped:
                          raw_record = read_source(path, info, zipped.write)
                      data = buffer.getvalue()
                      stored_record = {"size": len(data), "sha256": buffer.digest.hexdigest()}
                      require(hashlib.sha256(data).hexdigest() == stored_record["sha256"],
                              "compressed_digest_mismatch", name, info)
                  records[stored_name] = stored_record
                  compressed_data[stored_name] = data
                  compression[stored_name] = {
                      "encoding": "gzip", "raw_path": name,
                      "raw_size": raw_record["size"], "raw_sha256": raw_record["sha256"],
                      "stored_size": stored_record["size"], "stored_sha256": stored_record["sha256"],
                  }
              else:
                  require(total + info.st_size <= STORED_TOTAL_LIMIT,
                          "stored_payload_total_limit", name, info,
                          stored_payload_bytes=total + info.st_size, limit=STORED_TOTAL_LIMIT)
                  stored_name = name
                  records[name] = read_source(path, info, lambda data: None)
                  plain_info[name] = info
              total += records[stored_name]["size"]
              require(total <= STORED_TOTAL_LIMIT, "stored_payload_total_limit", name, info,
                      stored_payload_bytes=total, limit=STORED_TOTAL_LIMIT)
          require(len(records) <= 67, "payload_file_count_limit", "evidence", count=len(records), limit=67)
          output.mkdir()
          for name, record in records.items():
              target = output / name
              target.parent.mkdir(parents=True, exist_ok=True)
              if name in compressed_data:
                  with target.open("xb") as stream:
                      stream.write(compressed_data[name])
              else:
                  with target.open("xb") as stream:
                      copied = read_source(source / name, plain_info[name], stream.write)
                  require(copied == record, "stored_copy_source_changed", name,
                          (source / name).lstat())
              stored_info = target.lstat()
              require(stat.S_ISREG(stored_info.st_mode) and stored_info.st_size == record["size"]
                      and stored_info.st_size <= FILE_LIMIT,
                      "stored_copy_type_or_size", name, stored_info, expected_size=record["size"])
              verified = read_source(target, stored_info, lambda data: None)
              require(verified == record, "stored_copy_digest", name, target.lstat())
          receipt = {"schema": 1, "scope": "APT metadata resolution only; not native acceptance",
                     "source_sha": os.environ["EXPECTED_SOURCE_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                     "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "architecture": "amd64",
                     "registry": os.environ["SONIC_BAZEL_REGISTRY"], "bcr": "https://bcr.bazel.build/",
                     "bazel_version": "8.5.1", "bazel_sha256": os.environ["BAZEL_SHA"],
                     "resolver_version": "0.9.4.sonic.17", "update_outcome": os.environ["UPDATE_OUTCOME"],
                     "generated_lock_checked": os.environ["UPDATE_OUTCOME"] == "success",
                     "input_lock_unchanged": True, "files": records, "payload_bytes": total,
                     "raw_payload_bytes": raw_total, "compression": compression,
                     "review_required": True}
          receipt_bytes = (json.dumps(receipt, indent=2, sort_keys=True) + "\n").encode()
          require(len(receipt_bytes) <= PROVENANCE_LIMIT and total + len(receipt_bytes) <= STORED_TOTAL_LIMIT,
                  "provenance_or_total_size_limit", "provenance.json", size=len(receipt_bytes),
                  stored_payload_bytes=total, provenance_limit=PROVENANCE_LIMIT,
                  stored_total_limit=STORED_TOTAL_LIMIT)
          (output / "provenance.json").write_bytes(receipt_bytes)
          PYTHON
      - name: Retain reviewed-input lock metadata for inspection
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apt-lock-update-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apt-lock-update-evidence/
          if-no-files-found: error
          retention-days: 14
