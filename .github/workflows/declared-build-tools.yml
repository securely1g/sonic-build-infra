name: Declared build tools
on: workflow_dispatch
permissions:
  contents: read
jobs:
  resolve:
    name: Generate shared APT lock for DASH HA on amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BAZEL_VERSION: 8.5.1
      BAZEL_SHA: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install verified Bazel
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o bazel "https://releases.bazel.build/$BAZEL_VERSION/release/bazel-$BAZEL_VERSION-linux-x86_64"
          printf '%s  bazel\n' "$BAZEL_SHA" | sha256sum -c -
          chmod +x bazel
      - name: Generate and check the reviewed request graph
        shell: bash
        run: |
          set -euo pipefail
          python3 apt/lock.py update --bazel "$RUNNER_TEMP/bazel" \
            --work-dir "$RUNNER_TEMP/apt-prepare" \
            --bazel-startup-option=--ignore_all_rc_files \
            --bazel-option="--downloader_config=$GITHUB_WORKSPACE/ci/source_mirrors.cfg"
          python3 apt/lock.py check
          mkdir -p "$RUNNER_TEMP/verified-lock"
          cp apt/apt.lock.json apt/requests.json apt/sources.json "$RUNNER_TEMP/verified-lock"
          git rev-parse HEAD > "$RUNNER_TEMP/verified-lock/revision.txt"
          (cd "$RUNNER_TEMP/verified-lock"; sha256sum *.json > SHA256SUMS)
      - name: Keep resolver output and logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-dash-ha-lock
          path: |
            ${{ runner.temp }}/verified-lock/
            ${{ runner.temp }}/apt-prepare/partition-*/resolve.log
          if-no-files-found: warn
          retention-days: 14
