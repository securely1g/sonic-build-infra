name: PR64 download policy experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Sairedis cache restore (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            runner: ubuntu-24.04
            image: debian:trixie-20260918@sha256:d5ce19d4736f0ebbacd686d1040271a5aeb0cc920f5990c1bfae1717627f0674
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            image: debian:trixie-20260918@sha256:1808211ab6f37c6fc6a75368651697536f7bf47993f2797befa8908b1254979d
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    container:
      image: ${{ matrix.image }}
      options: --init
    defaults:
      run:
        shell: bash
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      MACHINE: ${{ matrix.machine }}
      CONTAINER_IMAGE: ${{ matrix.image }}
      BAZEL_ARCH: ${{ matrix.bazel_arch }}
      BAZEL_SHA: ${{ matrix.bazel_sha }}
    steps:
      - name: Install the consumer's host tools and pinned Bazel
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates gdb git python3 tar curl
          test "$(uname -m)" = "$MACHINE"
          test "$(dpkg --print-architecture)" = "$ARCHITECTURE"
          . /etc/os-release
          test "$ID:$VERSION_CODENAME" = debian:trixie
          curl --fail --location --retry 3 -o /usr/local/bin/bazel "https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-$BAZEL_ARCH"
          printf '%s  %s\n' "$BAZEL_SHA" /usr/local/bin/bazel | sha256sum --check --strict
          chmod +x /usr/local/bin/bazel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: infra
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-sairedis
          ref: baaafcfb9422ad55577717f4e7c342ba5293a54a
          path: consumer
          persist-credentials: false
      - name: Compare fresh cached restores without PR64
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/infra"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/consumer"
          python3 -B infra/tools/build_tools/cache_download_experiment.py \
            --infra "$GITHUB_WORKSPACE/infra" --consumer "$GITHUB_WORKSPACE/consumer" \
            --output "$GITHUB_WORKSPACE/ci-artifacts" --scratch "$RUNNER_TEMP/pr64-download-experiment" \
            --architecture "$ARCHITECTURE" --image "$CONTAINER_IMAGE"
      - name: Retain every outcome, including the expected baseline failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr64-download-policy-${{ matrix.architecture }}-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
